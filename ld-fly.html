<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сильвер — Летит со светящимся листиком</title><style>
:root{--sl-bg:#FBF7EE;--sl-ink:#8A7354;--sl-gold:#E9B949;--sl-gold-soft:#F6DFA0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--sl-bg);display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif}
.silver-loader{display:flex;flex-direction:column;align-items:center;gap:14px;user-select:none}
.sl-stage{position:relative;width:260px;height:260px}
.sl-stage canvas{position:absolute;z-index:3;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);pointer-events:none}
.sl-shadow{position:absolute;left:50%;bottom:10px;width:120px;height:16px;margin-left:-60px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(120,95,55,.22),rgba(120,95,55,0));}
.sl-char{position:absolute;left:50%;bottom:16px;transform-origin:50% 100%;will-change:transform}
.sl-char img{display:block;width:100%;height:auto;-webkit-user-drag:none}
.sl-text{color:var(--sl-ink);font-size:17px;font-style:italic;letter-spacing:.3px;min-height:1.4em;text-align:center;transition:opacity .35s}
.sl-dots i{display:inline-block;animation:sl-dot 1.4s infinite ease-in-out;font-style:normal}
.sl-dots i:nth-child(2){animation-delay:.18s}.sl-dots i:nth-child(3){animation-delay:.36s}
@keyframes sl-dot{0%,70%,100%{opacity:.15;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.sl-char,.sl-dots i{animation:none!important}}
.sl-stage canvas.sl-pp{position:absolute;inset:0;width:100%;height:100%;z-index:1}</style><style>html,body{background:transparent!important;overflow:hidden}.sl-text{display:none!important}</style></head><body>
<div class="silver-loader" role="status" aria-label="Загрузка">
  <div class="sl-stage"><div class="sl-shadow"></div><canvas></canvas></div>
  <div class="sl-text"><span class="sl-cap">Уже летим</span><span class="sl-dots"><i>.</i><i>.</i><i>.</i></span></div>
</div>
<script>{
function SilverFX(canvas){
  const ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;const P=[];
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);const r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;}
  size();addEventListener('resize',size);
  const PAD=30; // canvas is 30px larger than stage on each side
  function star(x,y,s,a,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;
    const g=ctx.createRadialGradient(0,0,0,0,0,s*2.2);g.addColorStop(0,'rgba(246,196,88,.45)');g.addColorStop(1,'rgba(246,196,88,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*2.2,0,7);ctx.fill();
    ctx.fillStyle=col||'#F2BE45';ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(0,0,s,0);ctx.quadraticCurveTo(0,0,0,s);
    ctx.quadraticCurveTo(0,0,-s,0);ctx.quadraticCurveTo(0,0,0,-s);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*.18,0,7);ctx.fill();ctx.restore();}
  function dot(x,y,s,a,col){ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill();ctx.globalAlpha=1;}
  function text(x,y,s,a,str){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#A08A66';ctx.font='italic '+s+'px Georgia,serif';ctx.fillText(str,x,y);ctx.restore();}
  return {
    // x,y in STAGE coordinates (0..stage size)
    add(o){P.push(Object.assign({vx:0,vy:0,g:0,life:0,max:1,size:4,rot:Math.random()*6,vr:0,kind:'star',col:null},o,{x:o.x+PAD,y:o.y+PAD}));},
    step(dt){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
      for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;if(p.life>=p.max){P.splice(i,1);continue;}
        p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;const k=p.life/p.max;
        const a=k<.2?k/.2:1-(k-.2)/.8;
        if(p.kind==='star')star(p.x,p.y,p.size*(k<.3?.5+k/.6:1),a,p.rot,p.col);
        else if(p.kind==='dot')dot(p.x,p.y,p.size,a*.85,p.col||'#EAB443');
        else if(p.kind==='z')text(p.x,p.y,p.size*(.7+k*.6),a,'z');
      }}
  };
}
function silverRun(fn){let last=performance.now(),t0=last;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function f(now){const dt=Math.min((now-last)/1000,.05);last=now;fn(window.__freeze!=null?window.__freeze:(now-t0)/1000,reduce?dt*.35:dt);requestAnimationFrame(f);}requestAnimationFrame(f);}
const rnd=(a,b)=>a+Math.random()*(b-a);

function SilverPuppet(stage,rig,imgs,opt){
  const cv=document.createElement('canvas');cv.className='sl-pp';stage.appendChild(cv);
  const W=stage.clientWidth,H=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext('2d');const [iw,ih]=rig.size;const s=opt.width/iw,ox=(W-iw*s)/2,oy=H-opt.bottom-ih*s;
  const P=rig.parts,order=Object.keys(P).sort((a,b)=>P[a].z-P[b].z);let loaded=0;const I={};
  for(const k in imgs){I[k]=new Image();I[k].onload=()=>loaded++;I[k].src=imgs[k];}
  const M=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
  function local(p,m){const a=(m.a||0)*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a),sx=m.sx||1,sy=m.sy||1,[px,py]=p.pivot;
    // translate(pivot+d) * rotate * scale * translate(-pivot)
    let T=[1,0,0,1,px+(m.dx||0),py+(m.dy||0)];T=M(T,[cs,sn,-sn,cs,0,0]);T=M(T,[sx,0,0,sy,0,0]);return M(T,[1,0,0,1,-px,-py]);}
  const api={map:{},
    world(name,x,y){const m=api.map[name];if(!m)return[0,0];return [ox+(m[0]*x+m[2]*y+m[4])*s,oy+(m[1]*x+m[3]*y+m[5])*s];},
    frame(t,pose,blink){const n=Object.keys(I).length;
      const G={};const get=k=>{if(G[k])return G[k];const p=P[k];const par=p.parent?get(p.parent):[1,0,0,1,0,0];return G[k]=M(par,local(p,pose[k]||{}));};
      for(const k in P)get(k);api.map=G;if(loaded<n)return;
      c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
      for(const k of order){const m=G[k],p=P[k];c.setTransform(dpr*s*m[0],dpr*s*m[1],dpr*s*m[2],dpr*s*m[3],dpr*(ox+s*m[4]),dpr*(oy+s*m[5]));
        c.drawImage(I[k],p.x,p.y,p.w,p.h);
        if(k==='head'&&blink>0)for(const e of rig.eyes){ // eyelid in head space
          c.save();c.filter='blur(0.8px)';c.beginPath();c.ellipse(e.x,e.y,e.rx*1.1,e.ry*1.12,0,0,7);c.clip();
          const ly=e.y-e.ry*1.18+2*e.ry*1.18*blink;const g=c.createLinearGradient(0,e.y-e.ry*1.2,0,ly);
          g.addColorStop(0,e.fur);g.addColorStop(1,e.fur2);c.fillStyle=g;
          c.fillRect(e.x-e.rx*1.3,e.y-e.ry*1.3,e.rx*2.6,ly-(e.y-e.ry*1.3));c.restore();
          c.strokeStyle='rgba(58,44,34,'+Math.min(1,blink*1.5)+')';c.lineWidth=Math.max(1.6,e.rx*.14);c.lineCap='round';
          c.beginPath();c.moveTo(e.x-e.rx*.95,ly);c.quadraticCurveTo(e.x,ly+e.ry*.32*blink,e.x+e.rx*.95,ly);c.stroke();}
      }}};
  return api;
}
// smooth helpers
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
function blinkAt(t){const P=[0.0,3.2,4.0,7.6,11.1];const c=t%12.4;for(const b of P){const d=c-b;if(d>=0&&d<.22)return d<.07?d/.07:d<.11?1:1-(d-.11)/.11;}return 0;}

// flying: paddling feet, swaying leaf, wind in the ears
function pose(t){const f=Math.sin(t*6);
  return {body:{dy:Math.sin(t*2)*-8,a:Math.sin(t*1)*3,sy:1+Math.sin(t*4)*.01},
    head:{a:Math.sin(t*1.4)*3},
    earL:{a:Math.sin(t*9)*5+Math.sin(t*1.4-.5)*4},earR:{a:Math.sin(t*9+1)*-5},
    foot1:{a:f*14},foot2:{a:-f*14},tail:{a:Math.sin(t*5)*10},
    leaf:{a:Math.sin(t*2-.6)*7}};}
let acc=0;silverRun((t,dt)=>{pp.frame(t,pose(t),blinkAt(t+3));acc+=dt;
  if(acc>.03){acc=0;const [x,y]=pp.world('leaf',220+rnd(-25,25),230+rnd(-30,30));
    fx.add({kind:Math.random()<.7?'dot':'star',x,y,vx:rnd(-40,-15),vy:rnd(-4,10),max:rnd(.6,1.2),size:Math.random()<.7?rnd(1.2,2.4):rnd(3,5)});}
  fx.step(dt);});
